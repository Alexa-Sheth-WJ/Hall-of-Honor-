<title>The Hall of Honor · The Venetian Resort Las Vegas</title>
<style>
:root{
  --bg:#2A0005; --surface:#5E000A; --surface-2:#4A0008; --ink:#FBEEDA; --muted:#E2C7BE;
  --line:rgba(251,238,218,.16); --accent:#E83F55; --mine:rgba(232,63,85,.24); --logo:#FBEEDA; --field:#3A0007;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#FFFAF2; --surface:#FBEEDA; --surface-2:#F6E2C8; --ink:#5E000A; --muted:#7B3B41;
    --line:rgba(94,0,10,.14); --mine:rgba(232,63,85,.16); --logo:#5E000A; --field:#FFFFFF; color-scheme:light;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;display:grid;place-items:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
.frame{width:100vw;height:100vh;height:100dvh;background:var(--bg);container:frame/size;overflow:hidden;position:relative}
.frame.fixed{height:auto;aspect-ratio:var(--ar);width:min(100vw, calc(100vh * var(--r)));width:min(100vw, calc(100dvh * var(--r)))}
.in{position:absolute;inset:0;display:flex;flex-direction:column;gap:clamp(6px,2cqmin,14px);padding:clamp(8px,3cqmin,26px);
  --fs-row:clamp(13.5px,calc(9px + 1.2cqmin),21px); --fs-sm:clamp(11.5px,calc(8px + .9cqmin),16px);
  --fs-h:clamp(13px,calc(8.5px + 1.15cqmin),19px); --fs-q:clamp(16px,calc(11px + 1.2cqmin),21px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* header */
.hd{display:flex;align-items:center;gap:10px;flex:none}
.mark{background:var(--logo);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex:none}

.ttl{margin-left:auto;text-align:right;min-width:0}
.ttl h1{font-size:clamp(16px,min(4.6cqw,calc(10px + 3cqmin)),38px);font-weight:600;letter-spacing:-.01em;line-height:1.1}

/* badges */
.bdg{display:block;border-radius:50%;flex:none;aspect-ratio:1;position:relative;overflow:hidden}
.bdg img{width:100%;height:100%;display:block;border-radius:50%}
.bdg svg{position:absolute;inset:0;width:100%;height:100%}
.arc{font-family:"Times New Roman",Times,Georgia,serif;font-size:8.4px;letter-spacing:.7px;fill:#E9C877;font-weight:600}

/* personal card */
.me{flex:none;display:flex;align-items:center;gap:clamp(8px,1.6cqmin,14px);background:var(--surface);border-radius:14px;
  padding:clamp(8px,1.4cqmin,14px);box-shadow:inset 0 0 0 1.5px var(--accent)}
.me[hidden]{display:none}
.me .bdg{width:clamp(38px,9cqmin,72px)}
.me .tx{min-width:0;flex:1}
.me .who{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--muted);line-height:1.3}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;animation:status 2s ease-in-out infinite}
@keyframes status{0%,100%{opacity:1}50%{opacity:.35}}
.me strong{display:block;font-size:var(--fs-h);font-weight:600;line-height:1.25}
.me small{display:block;font-size:var(--fs-sm);color:var(--muted);line-height:1.3}
.me .ty{color:var(--ink);font-style:italic}
.pill{flex:none;font-size:var(--fs-sm);font-weight:600;border:1px solid var(--line);border-radius:999px;padding:.4em .9em;min-height:30px}
.pill:hover{border-color:var(--accent)}

/* search */
.sbar{flex:none;position:relative}
.sbar svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
.q{width:100%;font:inherit;font-size:var(--fs-q);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;
  padding:.45em 10px .45em 34px;min-height:38px;-webkit-appearance:none;appearance:none}
.q::placeholder{color:var(--muted);opacity:.85}

/* main scroll area (narrow) */
.main{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:clamp(8px,2cqmin,14px);scrollbar-width:thin}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(6px,1.6cqmin,12px);flex:none}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:clamp(8px,2cqmin,16px) 6px;background:var(--surface);border-radius:14px;
  text-align:center;transition:transform .2s ease,box-shadow .2s ease;min-width:0}
.tile .bdg{width:clamp(52px,min(17cqw,16cqmin),110px);transition:transform .25s ease}
.tile:hover .bdg{transform:scale(1.04) rotate(-3deg)}
.tile[aria-expanded="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.tile b{font-size:var(--fs-row);font-weight:600;line-height:1.2}
.tile span{font-size:var(--fs-sm);color:var(--muted);line-height:1.2}
.tiles[hidden]{display:none}
.panel{flex:none;display:flex;flex-direction:column;gap:8px}
.panel:empty{display:none}
.ph{display:flex;align-items:center;gap:10px;font-size:var(--fs-h);font-weight:600}
.ph .bdg{width:clamp(28px,6cqmin,44px)}
.ph span{color:var(--muted);font-weight:500;font-size:var(--fs-sm);margin-left:auto}
.hint{font-size:var(--fs-sm);color:var(--muted);padding:6px 2px;line-height:1.45}

/* sub-badge grids (milestones, branches) */
.sub{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(78px,20cqmin,130px),1fr));gap:8px}
.sb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;background:var(--surface-2);text-align:center;min-width:0}
.sb .bdg{width:clamp(48px,13cqmin,92px)}
.sb b{font-size:var(--fs-sm);font-weight:600;line-height:1.2}
.sb span{font-size:calc(var(--fs-sm) * .92);color:var(--muted)}
.sb[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}

/* drop-downs */
details{background:var(--surface-2);border-radius:10px}
details details{background:transparent;border-radius:0;border-top:1px solid var(--line)}
.lvl{display:flex;flex-direction:column;gap:6px}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:.6em 12px;font-size:var(--fs-h);font-weight:600;min-height:40px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:.45em;height:.45em;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s ease;flex:none;opacity:.7}
details[open] > summary::before{transform:rotate(45deg)}
summary span{margin-left:auto;font-weight:500;font-size:var(--fs-sm);color:var(--muted)}
details details summary{padding-left:22px;font-size:var(--fs-row)}
.rows{padding:0 12px 8px}
details details .rows{padding-left:22px}
.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:10px;align-items:baseline;padding:.42em 0;border-top:1px solid var(--line);font-size:var(--fs-row);line-height:1.3}
.row:first-child{border-top:0}
.row .d{color:var(--muted);text-align:right;font-size:var(--fs-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:calc(var(--fs-sm) * .88);font-weight:600;color:var(--accent);margin-left:6px;white-space:nowrap}
.row.mine{background:var(--mine);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:6px;border-top-color:transparent}
.row.mine .n{font-weight:600}
.row.mine .n::after{content:" \2605";color:var(--accent)}
.row.flash{animation:flash 1.6s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 2px var(--accent)}}

/* search results */
.res{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:.5em 10px;border-top:1px solid var(--line)}
.res:first-of-type{border-top:0}
.res .bdg{width:clamp(26px,5cqmin,38px);grid-row:span 2}
.res .n{font-size:var(--fs-row);font-weight:500;line-height:1.25}
.res .a{font-size:var(--fs-sm);color:var(--muted);line-height:1.25;grid-column:2}
.res .d{grid-row:1 / span 2;grid-column:3;font-size:var(--fs-sm);color:var(--muted);text-align:right;max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res.mine{background:var(--mine);border-radius:8px}
.res.mine .n::after{content:" \2605";color:var(--accent)}
.rlist{background:var(--surface-2);border-radius:10px;padding:4px 0}
mark{background:transparent;color:inherit;font-weight:700;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:2px}

/* responsive */
@container frame (min-width: 480px){ .tiles{grid-template-columns:repeat(4,minmax(0,1fr))} }
@container frame (max-width: 399px){
  .row{grid-template-columns:1fr;gap:0}
  .row .d{text-align:left}
  .res .d{display:none}
}
@container frame (max-height: 300px){
  .me small:not(.ty){display:none} .me .who{display:none}
  .tile{flex-direction:row;padding:6px 8px;text-align:left;gap:8px} .tile .bdg{width:30px} .tile > span:not(.bdg){display:none}
}
@container frame (max-height: 230px){
  .logo{width:84px} .ttl h1{font-size:15px}
  .me{padding:5px 8px} .me .bdg{width:28px} .me .ty{display:none} .pill{min-height:26px;padding:.25em .7em}
  .q{min-height:32px}
}
/* wide: controls + badge grid left, drop-downs right */
@container frame (min-width: 760px) and (min-height: 420px) and (min-aspect-ratio: 5/4){
  .in{display:grid;grid-template-columns:minmax(300px,38%) minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr);column-gap:clamp(16px,3cqw,40px)}
  .in > *{grid-column:1;min-width:0}
  .hd{flex-direction:column;align-items:flex-start;gap:clamp(6px,1.2cqmin,12px)} .ttl{margin-left:0;text-align:left}
  .main{display:contents}
  .tiles{grid-column:1;grid-template-columns:repeat(2,minmax(0,1fr));align-self:start;max-height:100%;min-height:0;overflow-y:auto;scrollbar-width:thin}
  .tile .bdg{width:clamp(48px,min(8cqw,10cqmin),96px)}
  .panel{grid-column:2;grid-row:1 / -1;overflow-y:auto;min-height:0;overscroll-behavior:contain;padding-right:4px;scrollbar-width:thin}
  .panel:empty{display:flex}
  .panel:empty::before{content:attr(data-empty);color:var(--muted);font-size:var(--fs-row);margin:auto;text-align:center;max-width:26ch;line-height:1.5}
}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>

  }

}

/* exclusive <details> groups: opening one closes its siblings; content rendered on first open */
function dd(label, count, build, group){
  const d = document.createElement('details'); d.dataset.g = group;
  const s = document.createElement('summary'); s.textContent = label;
  const c = document.createElement('span'); c.textContent = count; s.appendChild(c); d.appendChild(s);
  let built = false;
  d.addEventListener('toggle', () => {
    if (!d.open) return;
    if (!built){ d.appendChild(build()); built = true; }
    d.parentElement.querySelectorAll(':scope > details[data-g="' + group + '"]').forEach(o => { if (o !== d) o.open = false; });
  });
  return d;
}
function rows(list, extra){
  const w = document.createElement('div'); w.className = 'rows';
  list.forEach(x => {
    const r = document.createElement('div'); r.className = 'row' + (isMine(x) ? ' mine' : '');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = x.n;
    if (extra){ const t = extra(x); if (t){ const g = document.createElement('span'); g.className = 'tag'; g.textContent = t; n.appendChild(g); } }
    const d = document.createElement('span'); d.className = 'd'; d.textContent = x.d;
    r.append(n, d); w.appendChild(r); x._el = r;
  });
  return w;
}
function groupBy(list, key){ const m = new Map(); list.forEach(x => { const k = key(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; }
function head(p, extra){
  const h = document.createElement('div'); h.className = 'ph';
  h.append(badge(p.img, ''), document.createTextNode(p.name));
  const c = document.createElement('span'); c.textContent = extra || p.unit(p.items.length.toLocaleString('en-US')); h.appendChild(c);
  return h;
}
/* Bravo + Golden Gondola: year → quarter → names (newest first) */
function yearQuarter(p, tag){
  const lvl = document.createElement('div'); lvl.className = 'lvl';
  groupBy(p.items, x => x.y).forEach((ys, y) => {
    lvl.appendChild(dd(String(y), ys.length.toLocaleString('en-US'), () => {
      const inner = document.createElement('div');
      [...groupBy(ys, x => x.q)].sort((a, b) => b[0] - a[0]).forEach(([q, qs]) => {
        inner.appendChild(dd(q ? 'Q' + q : 'Year-round', qs.length, () => rows(qs, tag), p.id + 'q' + y));
      });
      return inner;
    }, p.id + 'y'));
  });
  return lvl;
}
/* Service: milestone badges → month → names */
function service(p){
  const wrap = document.createElement('div'); wrap.className = 'lvl';
  const sub = document.createElement('div'); sub.className = 'sub'; sub.setAttribute('role', 'group'); sub.setAttribute('aria-label', 'Milestones');
  const out = document.createElement('div'); out.className = 'lvl';
  const byM = groupBy(p.items, x => x.m);
  [5, 10, 15, 20, 25].forEach(m => {
    const list = byM.get(m) || [];
    const b = document.createElement('button'); b.className = 'sb'; b.type = 'button'; b.dataset.m = m; b.setAttribute('aria-pressed', 'false');
    const t = document.createElement('b'); t.textContent = m + ' Years';
    const c = document.createElement('span'); c.textContent = list.length.toLocaleString('en-US') + ' team members';
    b.append(badge('s' + m, m + ' years of service badge'), t, c);
    b.addEventListener('click', () => {
      const on = b.getAttribute('aria-pressed') !== 'true';
      sub.querySelectorAll('.sb').forEach(o => o.setAttribute('aria-pressed', 'false'));
      out.textContent = '';

      b.setAttribute('aria-pressed', 'true');
      const h = document.createElement('p'); h.className = 'hint'; h.textContent = m + '-year anniversaries in ' + SY + ', by month'; out.appendChild(h);

  openProgram(x.p);
  const open = sel => { const d = panel.querySelector(sel); if (d && !d.open){ d.open = true; d.dispatchEvent(new Event('toggle')); } return d; };
  if (x.p === 'bravo' || x.p === 'gondola'){
    const yd = [...panel.querySelectorAll('details[data-g="' + x.p + 'y"]')].find(d => d.firstChild.firstChild.textContent === String(x.y));
    if (yd){ yd.open = true; yd.dispatchEvent(new Event('toggle'));
      const qd = [...yd.querySelectorAll('details')].find(d => d.firstChild.firstChild.textContent === (x.q ? 'Q' + x.q : 'Year-round'));
      if (qd){ qd.open = true; qd.dispatchEvent(new Event('toggle')); } }
  }
  if (x.p === 'service'){
    panel.querySelector('.sb[data-m="' + x.m + '"]').click();
    const md = [...panel.querySelectorAll('details')].find(d => d.firstChild.firstChild.textContent === MONTHS[x.mo - 1]);
    if (md){ md.open = true; md.dispatchEvent(new Event('toggle')); }
  }
  if (x.p === 'veterans') panel.querySelector('.sb[data-b="' + x.br[0] + '"]').click();
  setTimeout(() => { if (x._el){ x._el.scrollIntoView({ block: 'center', behavior: 'smooth' }); x._el.classList.add('flash'); } }, 60);
}

/* ---------- search across all programs ---------- */
const q = $('q'); q.value = vars.search;
let terms = [];
function hl(name){
  const span = document.createElement('span'); span.className = 'n';
  if (!terms.length){ span.textContent = name; return span; }
  const f = fold(name), marks = new Array(name.length).fill(false);
  terms.forEach(t => { let i = f.indexOf(t); while (i >= 0){ for (let j = i; j < i + t.length; j++) marks[j] = true; i = f.indexOf(t, i + 1); } });
  for (let i = 0; i < name.length;){ let j = i; while (j < name.length && marks[j] === marks[i]) j++;
    const c = name.slice(i, j); if (marks[i]){ const m = document.createElement('mark'); m.textContent = c; span.appendChild(m); } else span.appendChild(document.createTextNode(c)); i = j; }
  return span;
}
function award(x){
  if (x.p === 'bravo') return { b: 'bravo', a: 'Bravo! award, ' + qLabel(x.y, x.q) };
  if (x.p === 'gondola') return { b: 'gondola', a: 'Golden Gondola, ' + x.tier + ', ' + qLabel(x.y, x.q) };
  if (x.p === 'service') return { b: 's' + x.m, a: x.m + ' Years of Service, ' + MON3[x.mo - 1] + ' ' + x.dy + ', ' + SY };
  return { b: 'br:' + x.br[0], a: vetLabel(x) };
}
let results = [], ri = 0, sentinel = null, io = null;
function more(n){
  const box = panel.querySelector('.rlist'); if (!box) return;
  for (let k = 0; k < n && ri < results.length; k++, ri++){
    const x = results[ri], w = award(x);
    const r = document.createElement('button'); r.type = 'button'; r.className = 'res' + (isMine(x) ? ' mine' : ''); r.style.width = '100%';
    const a = document.createElement('span'); a.className = 'a'; a.textContent = w.a;
    const d = document.createElement('span'); d.className = 'd'; d.textContent = x.d;
    r.append(badge(w.b, ''), hl(x.n), d, a);
    r.addEventListener('click', () => reveal(x));
    box.insertBefore(r, sentinel);
  }
}
function runSearch(){
  const raw = fold(q.value.trim());
  terms = raw ? raw.split(/\s+/).filter(Boolean) : [];
  if (io){ io.disconnect(); io = null; }
  if (!terms.length){ tiles.hidden = false; if (panel.dataset.mode === 'search'){ panel.dataset.mode = ''; openProgram(current); } return; }
  tiles.hidden = getComputedStyle(main).display !== 'contents';
  panel.dataset.mode = 'search';
  tiles.querySelectorAll('.tile').forEach(t => t.setAttribute('aria-expanded', 'false'));
  results = ALL.filter(x => terms.every(t => x.k.includes(t))).sort((a, b) => (b.t || 0) - (a.t || 0));
  panel.textContent = '';
  const h = document.createElement('div'); h.className = 'ph';
  h.textContent = results.length ? results.length.toLocaleString('en-US') + (results.length === 1 ? ' result' : ' results') : 'No results';
  panel.appendChild(h);
  if (!results.length){ const e = document.createElement('p'); e.className = 'hint'; e.textContent = 'No honorees match \u201c' + q.value.trim() + '\u201d. Check the spelling or try just a first or last name.'; panel.appendChild(e); return; }
  const box = document.createElement('div'); box.className = 'rlist'; sentinel = document.createElement('div'); sentinel.style.height = '1px'; box.appendChild(sentinel); panel.appendChild(box);
  ri = 0; more(40);
  if ('IntersectionObserver' in window){ io = new IntersectionObserver(es => { if (es[0].isIntersecting) more(40); }, { rootMargin: '300px' }); io.observe(sentinel); }
  else more(results.length);
}
let tmr; q.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(runSearch, 120); });
q.addEventListener('keydown', e => { if (e.key === 'Escape'){ q.value = ''; runSearch(); } });
if (vars.search) runSearch();
</script>
